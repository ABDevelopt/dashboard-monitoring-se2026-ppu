<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- PANANYO TAKA — KONSEP 2: CIRCULAR TELEMETRY & STATISTICAL COMPASS (TRANSPARENT BACKGROUND) -->
  <defs>
    <linearGradient id="compCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="compOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="compBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- 1. Lingkaran Telemetri Luar Presisi (Outer Ring with Precision Dash) -->
  <circle cx="256" cy="256" r="218" stroke="url(#compCircleGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="80 16 280 20" />

  <!-- 2. HURUF P (Kiri - Oranye BPS): Tiang + Busur Sempurna -->
  <rect x="136" y="146" width="38" height="220" rx="19" fill="url(#compOrangeGrad)" />
  <path d="M155 165 H228 C262 165 288 190 288 224 C288 258 262 283 228 283 H155" 
        stroke="url(#compOrangeGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 3. HURUF T (Kanan - Biru Royal): Atap Horizontal Lebar + Tiang Vertikal -->
  <rect x="236" y="146" width="168" height="38" rx="19" fill="url(#compBlueGrad)" />
  <rect x="301" y="146" width="38" height="220" rx="19" fill="url(#compBlueGrad)" />

  <!-- 4. Simpul Titik Kompas Koordinat Lapangan (GPS Node PPU) -->
  <circle cx="386" cy="165" r="14" fill="#FACC15" />
  <circle cx="136" cy="347" r="14" fill="#10B981" />
</svg>
